[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maintriage"
version = "0.1.0"
description = "QLoRA fine-tuning of a small LLM to triage train maintenance faults, against classical and zero-shot baselines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
# GPU stages (zero-shot and QLoRA). bitsandbytes 4-bit kernels need a CUDA GPU.
gpu = [
    "torch>=2.3",
    "transformers>=4.46",
    "peft>=0.13",
    "bitsandbytes>=0.43",
    "accelerate>=0.34",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
